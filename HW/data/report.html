<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчёт</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 900px; margin: auto; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }

    th { background: #f0f0f0; }
    h1 { color: #333; }
    h2 { color: #555; margin-top: 2rem; }
  </style>
</head>
<body>
  <h1>Отчёт по данным</h1>
  <p>Всего строк: <strong>50</strong></p>

      <tr><th>Колонка</th><th>Кол-во</th><th>Min</th><th>Max</th><th>Среднее</th></tr>

  <tr>
    <td>id</td>
    <td>50</td>
    <td>16.00</td>
    <td>9807.00</td>
    <td>5295.72</td>
  </tr>
  <tr>
    <td>price</td>
    <td>50</td>
    <td>11.14</td>
    <td>991.54</td>
    <td>461.88</td>
  </tr>
  <tr>
    <td>quantity</td>
    <td>50</td>

    <td>98.00</td>
    <td>48.42</td>
  </tr></tbody>
  </table>
  
  <h2>Колонка: object_type</h2>
  <table>
    <thead><tr><th>Значение</th><th>Кол-во</th></tr></thead>
    <tbody><tr><td>pen</td><td>25</td></tr><tr><td>eraser</td><td>18</td></tr><tr><td>book</td><td>7</td></tr></tbody>
  </table>

</html>
